<!DOCTYPE html>
<!-- هدية أحمد لدودتي ♥ -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لدودتي ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="stars.css">
</head>
<body class="loading">
  <!-- خلفية الـ 4 صور الثابتة والمتتابعة مع السكرول -->
  <div class="photo-bg-container" id="photoBg">
    <div class="photo-fixed-slide" style="background-image: url('1786676708311.png');"></div>
    <div class="photo-fixed-slide" style="background-image: url('IMG-20261005-WA0045.jpg');"></div>
    <div class="photo-fixed-slide" style="background-image: url('IMG-20261024-WA0014.jpg');"></div>
    <!-- الصورة الرابعة الجديدة -->
    <div class="photo-fixed-slide" style="background-image: url('IMG-20260817-WA0020.jpg');"></div> 
    <div class="photo-fixed-slide" style="background-image: url('IMG-20260722-WA0001(1) (1).jpg');"></div>

   </div>

  <!-- شاشة افتتاحية سينمائية -->
  <div id="loader">
    <svg class="heart-art" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 88C10 56 6 30 26 18c12-7 22-1 24 9 2-10 12-16 24-9 20 12 16 38-24 70z"/></svg>
    <p data-i18n="intro1">دودتي...</p>
    <p data-i18n="intro2">كل حاجة هنا اتعملت عشانك</p>
    <button id="enter">ادخلي يا دودتي</button>
  </div>

  <canvas id="bg" aria-hidden="true"></canvas>

  <nav class="controls">
    <button id="photoBtn" aria-label="Toggle Photos Background" title="خلفية الصور">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
    </button>
    <button id="langBtn" aria-label="Switch language">EN</button>
    <button id="themeBtn" aria-label="Toggle theme">☀</button>
    <button id="musicBtn" aria-label="Music" aria-pressed="false">♪</button>
  </nav>

  <header class="hero">
    <svg class="heart-art hero-art" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 88C10 56 6 30 26 18c12-7 22-1 24 9 2-10 12-16 24-9 20 12 16 38-24 70z"/></svg>
    <p class="hero-sub" data-i18n="heroSub"></p>
    <h1 class="hero-name display" data-i18n="heroName"></h1>
    <p class="hero-line display" data-i18n="heroLine"></p>
    <a class="cta" href="#letter" data-i18n="heroCta"></a>
  </header>

  <section id="letter" class="reveal">
    <button class="envelope" id="envelope">
      <span class="env-heart">♥</span>
      <span data-i18n="envText"></span>
    </button>
    <article class="letter" id="letterBody" hidden></article>
  </section>

  <!-- العداد الأسطوري بالثانية -->
  <section id="counterSec" class="reveal counter-sec">
    <div class="counter-panel">
      <h2 class="display" data-i18n="counterTitle"></h2>
      <p class="hint" data-i18n="counterSince"></p>
      <div class="counter" id="counter"></div>
    </div>
  </section>

  <!-- رسائل لعيون دودتي -->
  <section id="notesSec" class="reveal">
    <h2 class="display" data-i18n="notesTitle"></h2>
    <p class="hint" data-i18n="notesHint"></p>
    <div class="notes" id="notes"></div>
  </section>

  <section id="reasons" class="reveal">
    <h2 class="display" data-i18n="reasonsTitle"></h2>
    <p class="hint" data-i18n="reasonsHint"></p>
    <div class="cards" id="cards"></div>
  </section>

  <footer class="display" data-i18n="footer"></footer>

  <script src="script.js"></script>
  <script src="stars.js"></script>
</body>
</html>
